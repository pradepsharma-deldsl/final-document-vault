name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Find Flutter project
        shell: bash
        run: |
          echo "Repository contents:"
          find . -maxdepth 3 -type f -name "pubspec.yaml" -print

          PROJECT_DIR="$(dirname "$(find . -maxdepth 3 -type f -name "pubspec.yaml" -print -quit)")"

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ] && [ ! -f "./pubspec.yaml" ]; then
            echo "ERROR: pubspec.yaml not found"
            exit 1
          fi

          echo "Flutter project found at: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install dependencies
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Analyze
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          flutter analyze

      - name: Build APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-DM-apk
          path: |
            **/build/app/outputs/flutter-apk/app-debug.apk
